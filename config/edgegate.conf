# EdgeGate 默认配置
# 语法：key = value，[backend 名称] 定义上游；# 开头为注释。
# 所有 *_ms 都是毫秒；尺寸支持 K/M/G 后缀。

listen = 0.0.0.0:8080
admin_listen = 127.0.0.1:9900

# round_robin | least_conn
balancer = least_conn

# 保留客户端 Host；false 时改写为上游 authority。
preserve_host = true

# 总尝试次数（1 = 不重试）；只有幂等请求在安全时机才会重试。
max_attempts = 2
retry_idempotent_only = true
retry_body_buffer_bytes = 1M

# 客户端与上游超时
client_header_timeout_ms = 10000
client_idle_timeout_ms = 60000
client_write_stall_ms = 30000
upstream_connect_timeout_ms = 2000
upstream_response_timeout_ms = 30000
request_timeout_ms = 120000
shutdown_grace_ms = 5000

# 协议与缓冲上限
max_request_header_bytes = 32768
max_request_body_bytes = 0          # 0 = 不限制
max_response_header_bytes = 65536
client_buffer_high_watermark = 256K
client_buffer_low_watermark = 64K
upstream_buffer_high_watermark = 256K
upstream_buffer_low_watermark = 64K
max_total_buffered_bytes = 128M

# 连接池
max_connections_per_backend = 128
max_idle_connections_per_backend = 32
backend_idle_timeout_ms = 60000

# 健康检查：0 表示关闭主动检查
health_interval_ms = 5000
health_timeout_ms = 1000
health_path = /healthz
healthy_threshold = 2
unhealthy_threshold = 3
passive_failure_cooldown_ms = 5000

# "-" 表示 stderr
access_log = -
log_level = info

[backend app-a]
url = http://127.0.0.1:9001

[backend app-b]
url = http://127.0.0.1:9002

[backend app-c]
url = http://127.0.0.1:9003
