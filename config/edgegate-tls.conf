# EdgeGate + TLS + HTTP/2 示例配置
# 先生成自签名测试证书：
#   bash scripts/gen_test_cert.sh certs
# 生产环境请替换为受信任证书，并只暴露需要的端口。

listen = 0.0.0.0:8080
tls_listen = 0.0.0.0:8443
tls_cert = certs/cert.pem
tls_key = certs/key.pem
tls_min_version = 1.2
http2 = true

admin_listen = 127.0.0.1:9900
balancer = least_conn
max_attempts = 2
preserve_host = true

client_buffer_high_watermark = 256K
client_buffer_low_watermark = 64K
upstream_buffer_high_watermark = 256K
upstream_buffer_low_watermark = 64K
max_total_buffered_bytes = 128M

http2_max_request_body_bytes = 8M
http2_max_total_request_body_bytes = 32M
http2_max_concurrent_streams = 32

health_interval_ms = 5000
health_timeout_ms = 1000
health_path = /healthz
healthy_threshold = 2
unhealthy_threshold = 3

access_log = -
log_level = info

[backend app-a]
url = http://127.0.0.1:9001

[backend app-b]
url = http://127.0.0.1:9002

[backend app-c]
url = http://127.0.0.1:9003
